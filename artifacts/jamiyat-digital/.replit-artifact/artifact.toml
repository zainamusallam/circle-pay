kind = "web"
previewPath = "/"
title = "Circle Pay"
description = "Circle Pay is a responsive savings-circle demo with equal participant contributions, separate protected-balance joint accounts, and interactive monthly funding history."
version = "1.0.0"
id = "artifacts/jamiyat-digital"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24661

[services.development]
run = "pnpm --filter @workspace/jamiyat-digital run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/jamiyat-digital", "run", "build" ]
serve = "static"
publicDir = "artifacts/jamiyat-digital/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24661"
BASE_PATH = "/"
